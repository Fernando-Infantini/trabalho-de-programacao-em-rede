<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Servidor HTTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h1, p {
            text-align: center;
        }

        .imagens {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        img {
            width: 70%;
            height: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Página de Teste do Servidor HTTP</h1>

    <p>
        Esta página contém várias imagens grandes para testar
        concorrência, controle de banda e QoS do servidor.
    </p>

    <div class="imagens">
        <!-- Imagens usadas nos testes de transferência -->
        <img src="imagem1.bmp" alt="Imagem de teste 1">
        <img src="imagem2.bmp" alt="Imagem de teste 2">
        <img src="imagem3.bmp" alt="Imagem de teste 3">
        <img src="imagem4.bmp" alt="Imagem de teste 4">
        <img src="imagem5.bmp" alt="Imagem de teste 5">
    </div>
</body>
</html>
